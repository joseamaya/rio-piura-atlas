      por la quebrada Reventazón en episodios excepcionales de El Niño. Registra
      Tres Bocas (Chutuque, Ñapique y Ramón), Tapa del Cuy y Tapa de Márquez,
      acumulación de sedimentos en la laguna Ramón y defensas ribereñas. Es la
      fuente más concreta para el futuro módulo «El recorrido del agua».

