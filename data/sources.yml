    crs: "EPSG:32717"
    descarga: "https://mapping.emergency.copernicus.eu/activations/EMSR199/"
    limitaciones: >
      La capa publica la unión de observaciones por fecha, no una mancha simultánea. No es un modelo hidráulico ni una predicción.
    capas: [flood_2017]
    documento: EMSR199 10PIURA v2 y 11PARACHIQUE v1 — Delineation Overview
    pagina: Producto 10PIURA v2 / 11PARACHIQUE v1
    consultado: "2026-11-16"
    notas: >
      Atributos del vector: AOI10, Radarsat Ultra-Fine Beam (26/03) y
      Cosmo-SkyMed 3-15m Stripmap (30/03); AOI11, Radarsat (26/03). El PDF v2
      declara Sentinel-1A, en contradicción con el DBF; se usan los atributos
      del vector y se advierte en la ficha. En la auditoría de v0.2.2 no se
      reabrió el PDF: la discrepancia queda pendiente de confirmación
      documental. La capa publica solo «Flooded Area» y es la unión de fechas,
      no una mancha simultánea. Áreas en EPSG:32717: AOI10 80,785 + 73,040 =
      153,825 km² de suma, 56,772 km² de solapamiento, 97,053 km² de unión
      original y 96,507 km² publicados; AOI11 457,408 km² originales y 458,970
      km² publicados. Un polígono de AOI10 traía autointersección de anillo y
      se reparó con make_valid, sin descartar componentes. DOI de la
      activación: 10.2905/JRC.GKDVN10.

