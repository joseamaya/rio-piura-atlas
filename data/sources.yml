# Registro maestro de fuentes.
# Cada elemento publicado en el atlas debe referenciar un id de esta lista.

meta:
  proyecto: rio-piura-atlas
  actualizado: "2026-11-16"
  notas: >
    Estado: disponible | por_solicitar | por_verificar.
    La licencia se refiere al dato original, no a este repositorio.

