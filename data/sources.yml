# Registro maestro de fuentes.
# Cada elemento publicado en el atlas debe referenciar un id de esta lista.

meta:
  proyecto: rio-piura-atlas
  actualizado: "2026-11-16"
  notas: >
    Estado: disponible | por_solicitar | por_verificar.
    La licencia se refiere al dato original, no a este repositorio.

fuentes:
  - id: ana-subcuencas
    titulo: Unidades Hidrográficas del Perú (Pfafstetter)
    institucion: Autoridad Nacional del Agua
    url: https://geoservidorperu.minam.gob.pe/arcgis/rest/services/ZEE_VISOR/09_CARACTERIZACI%C3%93N_DEL_TERRITORIO_PIURA/MapServer/18
    fecha: "2008-01-05"
    escala: "1:100000"
    licencia: dato público
    estado: disponible
    metodo: descarga GeoJSON desde el servicio
    grupo: Límites, relieve y red
    notas: >
      R.M. N.° 033-2008-AG. Cuenca medida: 10 938,4 km² geodésicos. ANA publica
      11 021,8 km² en Shape_Area, calculado en EPSG:32718 (UTM 18S), fuera de la
      zona 17S del polígono. Ocho subcuencas oficiales; Bajo Piura es derivada.

  - id: copernicus-dem-30
    titulo: Copernicus DEM GLO-30 (tiles Terrarium)
    institucion: ESA / Airbus (AWS Open Data)
    url: https://registry.opendata.aws/copernicus-dem/
    fecha: "2021-01-01"
    escala: 30 m (producto); malla de trabajo ~140 m
    licencia: libre con atribución
    estado: disponible
    metodo: descarga de teselas Terrarium z11 y remuestreo a malla local
    grupo: Límites, relieve y red
    notas: >
      Usado para relieve, sombreado, cortes y malla de elevación. La malla de
      trabajo del atlas es de ~143 × 134 m; no se publican perfiles a 30 m.

  - id: hydrorivers
    titulo: HydroRIVERS v10.0
    institucion: WWF / HydroSHEDS
    url: https://www.hydrosheds.org/products/hydrorivers
    fecha: "2020-01-01"
    escala: ~500 m
    licencia: CC BY 4.0
    estado: disponible
    metodo: recorte y filtrado por área aportante
    grupo: Límites, relieve y red

  - id: ign-cartas
    titulo: Cartas nacionales del IGN
    institucion: Instituto Geográfico Nacional
    url: https://www.ign.gob.pe/
    fecha: null
    escala: "1:100000 / 1:25000"
    licencia: uso con atribución
    estado: por_verificar
    metodo: descarga y contraste
    grupo: Límites, relieve y red
    notas: Toponimia y contraste de límites; no se copia al repositorio.

  - id: osm-agua
    titulo: Cuerpos de agua (natural=water)
    institucion: OpenStreetMap contributors
    url: https://www.openstreetmap.org/
    fecha: "2026-11-16"
    escala: variable
    licencia: ODbL 1.0
    estado: disponible
    metodo: consulta Overpass
    grupo: Agua
    notas: Laguna Ramón, Ñapique, La Niña, Las Salinas.

  - id: osm-lugares
    titulo: Coordenadas de ciudades del valle
    institucion: OpenStreetMap contributors
    url: https://www.openstreetmap.org/
    fecha: "2026-11-16"
    escala: punto
    licencia: ODbL 1.0
    estado: disponible
    metodo: consulta de nodos de localidad OSM y contraste con cartas nacionales
    grupo: Límites, relieve y red
    notas: >
      Coordenadas de nodos de localidad (no centroides de distrito), aproximadas;
      no sustituyen cartografía oficial. Paita se marca fuera de la cuenca.

  - id: obras-esquematicas
    titulo: Poechos y canal Daniel Escobar — trazado esquemático
    institucion: Río Piura Atlas (elaboración propia)
    url: null
    fecha: "2026-11-16"
    escala: aproximada
    licencia: CC BY 4.0
    estado: disponible
    metodo: punto del dique y recta de referencia Poechos–Curumuy
    grupo: Agua
    notas: >
      Poechos se publica como punto en el dique, no como embalse: no hay geometría
      oficial del vaso. El canal es una recta de referencia, no el eje oficial; el
      PECHP documenta 54 km y 70 m³/s. No proviene del inventario de ANA/PECHP.

  - id: senamhi-aforos
    titulo: Caudales y niveles de estaciones del valle
    institucion: SENAMHI
    url: https://www.senamhi.gob.pe/
    fecha: null
    escala: punto
    licencia: por definir
    estado: por_solicitar
    metodo: solicitud de acceso a la información pública
    grupo: Agua
    notas: Puente Sánchez Cerro, Tambogrande, Chulucanas. Ver docs/07-solicitudes.md.

  - id: senamhi-pisco
    titulo: PISCO v2.1 — precipitación grillada
    institucion: SENAMHI
    url: https://www.senamhi.gob.pe/
    fecha: null
    escala: 0.1°
    licencia: por definir
    estado: por_solicitar
    metodo: registro y descarga
    grupo: Agua

  - id: pechp-poechos
    titulo: Operación de la represa de Poechos y trasvase
    institucion: Proyecto Especial Chira-Piura
    url: null
    fecha: null
    escala: punto
    licencia: por definir
    estado: por_solicitar
    metodo: solicitud institucional
    grupo: Agua

  - id: pechp-infraestructura
    titulo: PECHP — Poechos y canal Daniel Escobar (fichas públicas)
    institucion: Proyecto Especial Chira-Piura
    url: https://www.gob.pe/23915-proyecto-especial-chira-piura-resena-historica
    fecha: "2026-11-13"
    escala: punto / obra
    licencia: documento público (citación)
    estado: disponible
    metodo: consulta de fichas institucionales
    grupo: Agua
    notas: >
      Dique de Poechos 4°40′07″S, 80°30′13″W. Canal Daniel Escobar: 54 km y
      70 m³/s, desde el dique hasta Curumuy. No publica el eje del canal ni la
      geometría del vaso; el atlas no los inventa.

  - id: ana-infraestructura
    titulo: Inventario de infraestructura hidráulica
    institucion: Autoridad Nacional del Agua
    url: null
    fecha: null
    escala: "1:10000"
    licencia: por definir
    estado: por_solicitar
    metodo: solicitud de acceso a la información pública
    grupo: Agua

  - id: cenepred-riesgo
    titulo: Escenarios de riesgo por inundación — Piura
    institucion: CENEPRED / SIGRID
    url: https://sigrid.cenepred.gob.pe/
    fecha: null
    escala: variable
    licencia: por definir
    estado: por_verificar
    metodo: descarga y solicitud
    grupo: Inundaciones y riesgo

  - id: enfen-informes
    titulo: Informes técnicos ENFEN (1982-83, 1997-98, 2017)
    institucion: ENFEN
    url: https://enfen.gob.pe/
    fecha: null
    escala: cuenca
    licencia: documento público
    estado: disponible
    metodo: descarga directa
    grupo: Inundaciones y riesgo
    notas: Base para el relato histórico de El Niño.

  - id: copernicus-ems-emsr199
    titulo: Delineación de la inundación de marzo de 2017 (EMSR199, AOI10 y AOI11)
    institucion: Copernicus Emergency Management Service / Comisión Europea
    url: https://mapping.emergency.copernicus.eu/activations/EMSR199/
    fecha: "2017-03-30"
    escala: "1:76000–1:80000"
    licencia: reutilización de la Comisión Europea con atribución
    estado: disponible
    metodo: descarga de vectores oficiales; disolución, filtrado y simplificación
    grupo: Inundaciones y riesgo
    notas: >
      AOI10 Piura: Radarsat-2 (26/03) y Cosmo-SkyMed (30/03). AOI11 Parachique:
      solo Radarsat-2 (26/03). Cubre la llanura baja y el desierto adyacente, no
      toda la cuenca. DOI de la activación: 10.2905/JRC.GKDVN10.

  - id: sentinel-1-2017
    titulo: Imágenes Sentinel-1 de marzo de 2017
    institucion: Copernicus / ESA
    url: https://dataspace.copernicus.eu/
    fecha: "2017-03-01"
    escala: 10 m
    licencia: libre con atribución
    estado: disponible
    metodo: descarga y contraste
    grupo: Inundaciones y riesgo
    notas: >
      Se usa como contraste; la geometría publicada es el vector oficial de
      Copernicus EMSR199. No se deriva una mancha propia con umbral.

  - id: unosat-copernicus-ems
    titulo: UNOSAT / Copernicus EMS — inundación de marzo de 2017
    institucion: UNITAR / ESA
    url: https://emergency.copernicus.eu/
    fecha: "2017-03-01"
    escala: variable
    licencia: libre con atribución
    estado: por_verificar
    metodo: descarga y contraste visual
    grupo: Inundaciones y riesgo
    notas: Producto de referencia para contrastar; no se usa como geometría publicada.

  - id: arcc-plan-inundaciones
    titulo: Plan de Control de Inundaciones Río Piura (2018)
    institucion: ARCC / Autoridad Nacional del Agua
    url: null
    fecha: "2018-01-01"
    escala: "1:10000"
    licencia: por definir
    estado: por_solicitar
    metodo: solicitud de acceso a la información pública
    grupo: Inundaciones y riesgo
    notas: Obras, diagnóstico y defensas ribereñas.

  - id: ingemmet-geodinamica
    titulo: Estudio geodinámico de la cuenca del río Piura
    institucion: INGEMMET
