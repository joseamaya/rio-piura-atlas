# Registro maestro de fuentes.
# Cada elemento publicado en el atlas debe referenciar un id de esta lista.
#
# Estados:
#   disponible      el dato o documento se puede consultar y usar
#   por_solicitar   existe, pero requiere una solicitud institucional
#   por_verificar   citado, pero no se localizó el documento exacto
#
# Certidumbre de la fuente:
#   medido           serie, imagen o geometría medida por la institución
#   derivado         producto calculado (modelo, red hidrográfica, DEM)
#   documentado      informe, tesis o nota de prensa con referencia verificable
#   interpretacion   geometría elaborada por el atlas
#   por_verificar    falta confirmar el documento o el dato
#
# Tipo:
#   dataset | documento | prensa | elaboracion_propia

meta:
  proyecto: rio-piura-atlas
  actualizado: "2026-11-16"
  notas: >
    La licencia se refiere al dato original, no a este repositorio. «fecha» es
    la fecha del documento o del producto; «consultado» es la fecha de consulta
    del atlas. Si no se conoce la fecha del documento, se deja null.

