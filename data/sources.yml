    fecha: null
    escala: cuenca / valle
    licencia: dato público
    estado: disponible
    metodo: consulta de presentación técnica
    grupo: Estudios
    notas: >
      «Cambios de la embocadura del cauce principal: al mar antes de 1891 y en
      1983; a laguna San Ramón desde 1891».

  - id: udep-estudios
    titulo: Universidad de Piura — estudios de agua e inundaciones
    institucion: Universidad de Piura
    url: http://pirhua.udep.edu.pe/handle/123456789/1170
    fecha: null
    escala: cuenca / valle
    licencia: uso académico con atribución
    estado: por_verificar
    metodo: consulta bibliográfica
    grupo: Estudios
    notas: >
      Contraste técnico (p. ej. picos de 3 200 y 4 424 m³/s); no se reutilizan
      figuras sin permiso.

  - id: sernanp-illescas
    titulo: SERNANP — Reserva Nacional Illescas
    institucion: SERNANP
    url: https://cdn.www.gob.pe/uploads/document/file/2002543/Expediente%20Categorizaci%C3%B3n%20Zona%20Reservada%20Illescas.pdf.pdf
    fecha: "2021-12-24"
    escala: "1:100 000"
    licencia: documento público
    estado: disponible
    metodo: consulta de expediente de categorización
    grupo: Estudios
    notas: >
      Área protegida de 36 550,70 ha; centro aproximado 5°58′S, 81°05′O.
      No se usa como límite dibujado.

  - id: banco-mundial-gfdrr
    titulo: Banco Mundial / GFDRR — análisis de la inundación de 2017
    institucion: Banco Mundial / GFDRR
    url: null
    fecha: null
