  - id: senamhi-pisco
    titulo: PISCOp v3.0 — precipitación diaria y mensual grillada
    institucion: SENAMHI — Dirección de Hidrología
    url: https://doi.org/10.3390/hydrology13110306
    fecha: "2026-11-17"
    escala: "0,1° (~10 km)"
    licencia: "artículo CC BY 4.0; conjunto de datos en Figshare declara GPL 3.0+ (por aclarar)"
    estado: por_solicitar
    metodo: descarga de NetCDF desde Figshare; verificación de metadatos y del artículo
    grupo: Agua
    certeza: derivado
    tipo: dataset
    disponibilidad: pendiente
    tipo_evidencia: [cientifica]
    periodo: "1981–2025"
    formato: "NetCDF: diario (1,5 GB), mensual (54 MB) y climatología (1,8 MB)"
    crs: "EPSG:4326 (malla regular de 0,1°)"
    descarga: https://figshare.com/articles/dataset/High-resolution_grids_of_rainfall_for_Peru_-_PISCOp_v3_0_dataset/32411886
    documento: "Gutierrez, L., Huerta, A., Vásquez, S., Rau, P. y Lavado-Casimiro, W. (2026). Updating a High-Resolution Gridded Rainfall Dataset for Peru (PISCOp v3.0). Hydrology 13(11):306."
    pagina: "artículo y readme del conjunto de datos"
    consultado: "2026-11-17"
    limitaciones: >
      Es una estimación grillada, no una medición directa en cada punto. La
      resolución de 0,1° (~10 km) no resuelve por sí sola la cuenca alta, media
      y baja con el mismo detalle; una media por subcuenca debe declarar cuántas
      celdas usa y cómo pondera. El artículo es CC BY 4.0 y aclara que el
      **código** es GPL 3.0; la ficha del dataset en Figshare declara GPL 3.0+,
      pero la licencia específica del NetCDF no está explícita. No se publica
      una serie derivada hasta aclararla.
    capas: []
    notas: >
      PISCOp v3.0 cubre 1981–2025 con resolución 0,1° y paso diario y mensual.
      Además de Figshare, el Observatorio de SENAMHI permite descargar por
      punto, archivo o área en CSV/XLSX:
      https://observatorio.senamhi.gob.pe/investigadores/descarga-pisco
      Esa consulta usa Cloudflare Turnstile, así que no es automatizable sin
      resolver el captcha. La ficha de sequías de SENAMHI menciona ~5 km, pero
      el producto PISCOp documenta 0,1° (~10 km); no son la misma ficha. La
      versión v2.1 también era de 0,1°, cubría 1981–2018 y su soporte cuasi
      tiempo real está suspendido. No se debe citar 5 km ni 1981–2016 para
      v3.0. La prioridad sigue siendo una serie por subcuenca, no un ráster
      decorativo.

