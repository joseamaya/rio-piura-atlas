<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Render de la maqueta · propuesta</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; }
      canvas { display: block; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "../../web/node_modules/three/build/three.module.js",
          "three/addons/": "../../web/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

      const width = 2600;
      const height = 1800;
      const scene = new THREE.Scene();
      scene.background = null;

      const camera = new THREE.PerspectiveCamera(34, width / height, 100, 3_000_000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.AgXToneMapping;
      renderer.toneMappingExposure = 1.02;
      renderer.setClearColor(0x000000, 0);
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xdbe7e6, 0x8a7f63, 0.55));
      const sun = new THREE.DirectionalLight(0xfff4e0, 3.1);
      sun.position.set(-0.48, 0.70, 0.53).multiplyScalar(1000);
      scene.add(sun);
      const fill = new THREE.DirectionalLight(0xbfd4d2, 0.35);
      fill.position.set(0.6, 0.2, -0.8).multiplyScalar(1000);
      scene.add(fill);

      const draco = new DRACOLoader();
      draco.setDecoderPath("../../web/public/draco/");
      const loader = new GLTFLoader();
      loader.setDRACOLoader(draco);

      loader.load("../../web/public/models/piura.glb", (gltf) => {
        const root = gltf.scene;
        scene.add(root);
        scene.updateMatrixWorld(true);

        // Lámina limpia para la portada; con ?labels=1 se conservan los rótulos
        // para la página de la maqueta.
        const labelMode = new URLSearchParams(location.search).get("labels");
        const keyLabels = [
          "Piura", "Sechura", "Paita", "Chulucanas", "Tambogrande",
          "Represa_de_Poechos",
        ];
        const labelInfo = [];
        root.traverse((child) => {
          if (child.name.includes("Naciente")) {
            child.visible = false;
            return;
          }
          if (!child.name.startsWith("GEO-Etiqueta")) return;
          const base = child.name.replace(/^GEO-Etiqueta-/, "").replace(/-(placa|texto)(_\d+)?$/, "");
          if (labelMode === "key") {
            if (!keyLabels.includes(base)) child.visible = false;
            else child.scale.setScalar(1.2);
          } else if (!labelMode) {
            child.visible = false;
          }
          labelInfo.push({ name: child.name, base, visible: child.visible });
        });
        window.__labelInfo = labelInfo;

        const box = new THREE.Box3().setFromObject(root);
        const terrain = new THREE.Box3();
        root.traverse((child) => {
          const mesh = child;
          if (!mesh.isMesh || child.name.includes("Etiqueta")) return;
          if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
          if (mesh.geometry.boundingBox) {
            terrain.union(mesh.geometry.boundingBox.clone().applyMatrix4(mesh.matrixWorld));
          }
        });
        const terrainBox = terrain.isEmpty() ? box : terrain;
        const center = terrainBox.getCenter(new THREE.Vector3());
        const target = center.clone();
        target.y -= (terrainBox.max.y - terrainBox.min.y) * 0.28;

        const dir = new THREE.Vector3(-0.55, 0.60, 0.86).normalize();
        const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), dir).normalize();
        const up = new THREE.Vector3().crossVectors(dir, right).normalize();
        let halfW = 0;
        let halfH = 0;
        for (let i = 0; i < 8; i++) {
          const corner = new THREE.Vector3(
            i & 1 ? box.max.x : box.min.x,
            i & 2 ? box.max.y : box.min.y,
            i & 4 ? box.max.z : box.min.z,
          ).sub(center);
          halfW = Math.max(halfW, Math.abs(corner.dot(right)));
          halfH = Math.max(halfH, Math.abs(corner.dot(up)));
        }
        const vFov = THREE.MathUtils.degToRad(camera.fov);
        const distH = halfH / Math.tan(vFov / 2);
        const distW = halfW / (Math.tan(vFov / 2) * camera.aspect);
        const dist = Math.max(distH, distW) * 1.06;
        camera.position.copy(target).addScaledVector(dir, dist);
        camera.lookAt(target);
        camera.near = Math.max(dist / 1000, 0.1);
        camera.far = dist * 40;
        camera.updateProjectionMatrix();

        renderer.render(scene, camera);
        window.__ready = true;
      }, undefined, (error) => {
        window.__error = String(error);
      });
    </script>
  </body>
</html>
